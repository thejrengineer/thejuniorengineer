<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404 | Velumo</title><meta name="description" content="Page not found. Return to Velumo homepage or start your next digital project."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet"><style>
:root{--color-bg:#0A0A0A;--color-surface:#111;--color-border:#1E1E1E;--color-accent:#7B5EA7;--color-accent2:#00D4AA;--color-text:#F0EEE8;--color-muted:#6B6B6B}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;background:var(--color-bg);color:var(--color-text);font-family:Inter,sans-serif;overflow:hidden}.wrap{text-align:center;padding:20px;position:relative;z-index:2}.bg404{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(160px,35vw,420px)/1 Syne,sans-serif;color:rgba(240,238,232,.04);letter-spacing:-.05em;z-index:1}.title{font:800 clamp(34px,6vw,72px)/1 Syne,sans-serif;letter-spacing:-.03em;margin-bottom:10px}.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid var(--color-border);padding:12px 16px;text-decoration:none;color:var(--color-text);border-radius:8px}.btn.p{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
.shape{position:absolute;border:1px solid var(--color-border);z-index:0}.s1{width:130px;height:130px;left:8%;top:16%}.s2{width:90px;height:90px;right:12%;top:22%;border-radius:50%}.s3{width:160px;height:90px;left:14%;bottom:14%}.s4{width:120px;height:120px;right:8%;bottom:16%;transform:rotate(20deg)}
</style></head><body>
<div class="bg404">404</div>
<div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div><div class="shape s4"></div>
<main class="wrap"><h1 class="title">You wandered off the map.</h1><p>The page you're looking for doesn't exist — but your dream website can.</p><div class="btns"><a href="index.html" class="btn p">Take me home →</a><a href="contact.html" class="btn">Start a project →</a></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script><script>
window.addEventListener("load",()=>{gsap.from(".title,p,.btn",{y:28,opacity:0,stagger:.08,duration:.8,ease:"power3.out"});gsap.to(".s1",{y:-24,x:16,duration:3.6,repeat:-1,yoyo:true,ease:"sine.inOut"});gsap.to(".s2",{y:18,x:-12,duration:4.1,repeat:-1,yoyo:true,ease:"sine.inOut"});gsap.to(".s3",{y:-20,rotation:8,duration:4.4,repeat:-1,yoyo:true,ease:"sine.inOut"});gsap.to(".s4",{y:16,rotation:28,duration:3.8,repeat:-1,yoyo:true,ease:"sine.inOut"});});
window.addEventListener("beforeunload",()=>{if(window.ScrollTrigger){ScrollTrigger.getAll().forEach(t=>t.kill())}});
</script></body></html>
